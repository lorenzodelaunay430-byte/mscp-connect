          base64 -d /tmp/mscp_connect.zip.b64 > /tmp/mscp_connect.zip
          mkdir -p appsrc
          unzip -q /tmp/mscp_connect.zip -d appsrc
          rm -rf appsrc/.github

      - name: Générer Android
        working-directory: appsrc
        run: flutter create . --platforms=android --org fr.mscp

      - name: Installer les dépendances
        working-directory: appsrc
        run: flutter pub get

      - name: Compiler APK release
        working-directory: appsrc
        run: flutter build apk --release

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MSCP-Connect-APK
          path: appsrc/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
